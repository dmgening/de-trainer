# /etc/litestream.yml — continuous SQLite replication to R2 (or B2).
# Credentials come from the environment: LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY.
# Written for the Litestream 0.3 config format; check against the installed version.
dbs:
  - path: /var/lib/de-trainer/app.sqlite
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: de-class/app.sqlite
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        retention: 720h
        snapshot-interval: 24h
